[project]
name = "project-planner-backend"
version = "0.1.0"
description = "Backend server for the Project Planner web app."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6,<1",
    "uvicorn>=0.34.0,<1",
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "models", "storage"]

# Keep the dependency ranges above in sync with requirements.txt.